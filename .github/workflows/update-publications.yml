name: Sync Google Scholar publications

on:
  schedule:
    # 03:17 UTC daily — off-the-hour to avoid GitHub's busy cron minute
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest publications from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_scholar.py

      - name: Commit updated publications.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json

          if git diff --cached --quiet; then
            echo "No changes to publications.json"
            exit 0
          fi

          git commit -m "chore: sync publications from Google Scholar"

          # Retry: GitHub intermittently rejects pushes with
          # "fatal error in commit_refs", and main may have moved on
          # while this job was running.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and retrying"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 10))
          done

          echo "Push failed after 3 attempts"
          exit 1
