name: Sync Google Scholar publications

on:
  schedule:
    # 03:17 UTC daily — off-the-hour to avoid GitHub's busy cron minute
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest publications from Google Scholar
        id: fetch
        run: python scripts/fetch_scholar.py
        continue-on-error: true

      - name: Commit updated publications.json
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No changes to publications.json"
          else
            git commit -m "chore: sync publications from Google Scholar"
            git push
          fi
